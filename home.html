<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style.css">

    <script src="editting.js" defer></script>

<body>
    <nav>
        <a href="current.html">Technicians.</a>
        <a href="home.html">Reports Water Issues</a>
        <a href="history.html">History</a>
        <a href="about.html">About us.</a>
        <a href="contact.html">Contact Info.</a>


    </nav>
    <h2 id="tittle">KILIFI WATER POINT SYSTEM</h2>

    <form action="login.html" method="post"><br>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required><br><br>
        <label for="issue">Issue Description:</label><br><br>
        <input type="radio" id="issue" name="issue" required>
        <label for="issue">Broken Water Point</label><br><br>
        <input type="radio" id="issue" name="issue" required>
        <label for="issue">Water Leakage</label><br><br>
        <input type="radio" id="issue" name="issue" required>
        <label for="issue">Water Shortage</label><br><br>
        <input type="radio" id="issue" name="issue" required>
        <label for="issue">Other
            <ul>
                <li>Water Quality</li>
                <li>Water Pressure</li>
                <li>Water Contamination</li>
            </ul>
        </label><br><br>
        <label for="location">Location:</label>
        <input type="text" id="location" name="location" required><br><br>
        <label for="evidence">Proof of Evidence:</label>
        <input type="file" accept="image/*, video/*"><br><br>
        <div id="map" style="width: 100%; height: 400px;">
            <label for="location">Live Location:</label><br><br>
            <button type="button" onclick="getLocation()">Get Current Location</button><br><br>
            <input type="text" id="latitude" name="latitude"><br><br>
            <input type="text" id="longitude" name="longitude">
        </div>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
